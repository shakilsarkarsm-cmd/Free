<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout</title>
<style>
  :root {
    --pink: #e2136e;   /* bKash brand */
    --orange: #f6871f; /* Nagad brand */
    --ink: #1a1a1a;
    --bg: #f7f7f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: #666; font-size: 14px; }
  label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 20px;
  }
  .methods { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }
  button.method {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.method:hover { opacity: 0.9; }
  button.method:disabled { opacity: 0.6; cursor: not-allowed; }
  .bkash { background: var(--pink); }
  .nagad { background: var(--orange); }
  #status { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
  #status.error { color: #c0392b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Complete your payment</h1>
    <p class="sub">Pay securely using bKash or Nagad.</p>

    <label for="amount">Amount (BDT)</label>
    <input type="number" id="amount" min="1" step="0.01" placeholder="e.g. 500" />

    <div class="methods">
      <button class="method bkash" id="pay-bkash">Pay with bKash</button>
      <button class="method nagad" id="pay-nagad">Pay with Nagad</button>
    </div>

    <div id="status"></div>
  </div>

<script>
  const statusEl = document.getElementById('status');
  const amountEl = document.getElementById('amount');

  async function pay(method) {
    const amount = amountEl.value;
    if (!amount || Number(amount) <= 0) {
      statusEl.textContent = 'Please enter a valid amount.';
      statusEl.className = 'error';
      return;
    }

    document.querySelectorAll('button.method').forEach(b => b.disabled = true);
    statusEl.className = '';
    statusEl.textContent = 'Redirecting to ' + method + '...';

    try {
      const res = await fetch('/api/pay/pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, method })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Payment failed to start.');

      window.location.href = data.redirectUrl;
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = 'error';
      document.querySelectorAll('button.method').forEach(b => b.disabled = false);
    }
  }

  document.getElementById('pay-bkash').addEventListener('click', () => pay('bkash'));
  document.getElementById('pay-nagad').addEventListener('click', () => pay('nagad'));
</script>
</body>
</html>
