<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binance Payment Verification</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif;color:#18202b}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:25px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.logo{width:55px;height:55px;margin:auto;border-radius:50%;background:#f0b90b;display:grid;place-items:center;font-size:28px;font-weight:bold;color:#111}
h2{text-align:center;margin:14px 0 5px}.sub{text-align:center;color:#777;font-size:14px;margin-bottom:22px}
.details{background:#f8f9fb;border-radius:14px;padding:15px;margin-bottom:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e5e7eb;font-size:14px}
.row:last-child{border:0}.label{color:#727985}.value{font-weight:bold;text-align:right}
.usd{text-align:center;font-size:29px;font-weight:bold;margin:5px 0}
.rate{text-align:center;color:#777;font-size:12px;margin-bottom:10px}
label{display:block;font-weight:bold;font-size:14px;margin:13px 0 7px}
input{width:100%;padding:13px;border:1px solid #d6dae1;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#f0b90b}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:11px;background:#f0b90b;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
#result{display:none;margin-top:16px;padding:14px;border-radius:11px;background:#edf9f1;color:#16733a;text-align:center;font-size:14px;line-height:1.5}
.small{text-align:center;color:#999;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <div class="logo">₿</div>
  <h2>Payment Verification</h2>
  <div class="sub">Binance Payment</div>

  <div class="details">
    <div class="row"><span class="label">Payment Amount</span><span class="value">৳2,500</span></div>
    <div class="usd">$20.16</div>
    <div class="rate">1 USD = ৳124</div>
    <div class="row"><span class="label">Binance ID</span><span class="value">873076865</span></div>
  </div>

  <label for="username">Telegram Username</label>
  <input id="username" type="text" placeholder="@username">

  <label for="txid">Transaction ID / TxID</label>
  <input id="txid" type="text" placeholder="Transaction ID লিখুন">

  <button onclick="submitPayment()">Submit Payment</button>

  <div id="result">
    আপনার পেমেন্টটি ভেরিফাই হচ্ছে।<br>
    কিছুক্ষণ অপেক্ষা করুন, পরে আপনাকে জানানো হবে।
  </div>

  <div class="small">Payment submission interface</div>
</div>
</div>

<script>
function submitPayment(){
  const username=document.getElementById("username").value.trim();
  const txid=document.getElementById("txid").value.trim();

  if(!username){
    alert("আপনার Telegram Username দিন");
    return;
  }
  if(!txid){
    alert("Transaction ID দিন");
    return;
  }

  /*
    Telegram bot token এখানে রাখা হয়নি।
    নিরাপদভাবে Telegram API ব্যবহার করতে backend/Cloud Function
    বা Replit Secret (BOT_TOKEN) ব্যবহার করুন।
  */

  const result=document.getElementById("result");
  result.style.display="block";

  // Demo: verification message দেখিয়ে homepage-এ ফেরত যাবে।
  setTimeout(function(){
    window.location.href="index.html";
  },3000);
}
</script>
</body>
</html>
